:root{--azul:#778fff;--tinta:#1a1a2e;--gris:#6b7280;--linea:#e2e5ee;--velo:#e5e9fa;}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-family:'Inter',sans-serif;color:var(--tinta);-webkit-text-size-adjust:100%;}
body{background:#fff;font-size:17px;line-height:1.6;}
.hoja{max-width:680px;margin:0 auto;padding:0 22px 64px;}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:30px 0 18px;}
.masthead .logo{flex-shrink:0;width:clamp(56px,17vw,84px);}
.masthead .logo img{width:100%;height:auto;display:block;}
.masthead .titulo{order:1;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.masthead .titulo .linea{display:block;width:100%;height:auto;overflow:visible;}
.masthead .titulo .linea text{font-family:'DM Serif Display',serif;font-weight:400;letter-spacing:-0.01em;}
.subcab{font-weight:700;font-style:italic;font-size:0.9rem;border-top:2.5px solid var(--tinta);border-bottom:2.5px solid var(--tinta);padding:8px 0;margin-bottom:26px;}
.intro{color:var(--gris);margin-bottom:26px;}
.lista-hojas{list-style:none;}
.item-hoja{display:block;border:1px solid var(--linea);border-radius:10px;padding:18px 20px;margin-bottom:14px;text-decoration:none;color:inherit;transition:border-color .15s,background .15s;}
.item-hoja:hover{border-color:var(--azul);background:var(--velo);}
.item-hoja .fecha{font-family:'Roboto',sans-serif;font-weight:700;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--azul);margin-bottom:6px;}
.item-hoja .titulo-hoja{font-family:'DM Serif Display',serif;font-size:1.35rem;line-height:1.15;margin-bottom:6px;color:var(--tinta);}
.item-hoja .tiempo{font-size:0.85rem;color:var(--gris);}
.vacio{color:var(--gris);text-align:center;padding:40px 0;}
.cierre{margin-top:48px;border-top:1px solid var(--linea);padding-top:20px;font-size:0.8rem;color:var(--gris);text-align:center;line-height:1.6;}
.cierre .firma{font-family:'DM Serif Display',serif;color:var(--azul);margin-bottom:6px;font-size:1rem;}
</style>
</head>

<script src="hojas.js"></script>
<script>
  const lista = document.getElementById('lista');
  if(typeof HOJAS !== 'undefined' && HOJAS.length){
    // ordenar por fecha descendente (más reciente arriba)
    HOJAS.sort((a,b)=> b.fecha.localeCompare(a.fecha));
    lista.innerHTML = HOJAS.map(h =>
      '<a class="item-hoja" href="'+h.archivo+'">'+
        '<div class="fecha">'+formatoFecha(h.fecha)+'</div>'+
        '<div class="titulo-hoja">'+h.titulo+'</div>'+
        '<div class="tiempo">'+h.tiempo+'</div>'+
      '</a>'
    ).join("");
  } else {
    lista.innerHTML = '<li class="vacio">Aún no hay hojas publicadas.</li>';
  }
  function formatoFecha(iso){
    const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    const [a,m,d]=iso.split('-');
    return parseInt(d)+' de '+meses[parseInt(m)-1]+' de '+a;
  }
</script>
